# ============================================================
# Pipeline CI/CD - EUROVIP (BackOffice)
# Copiado de BackTiTan (azure-pipelines.yml) y adaptado a Eurovip.
# Estrategia: Blue-Green Deployment en IIS on-premise (DeploymentScripts/Deploy.ps1).
#
# Flujo (igual que BackTiTan, pedido de la usuaria 19/11/2026: «que el BackOffice Eurovip se suba
# automático como el BackTitan»):
#   cada push a main → Build → Deploy PRODUCCIÓN (espera aprobación manual en el Environment «Produccion»:
#   Pipelines → Environments → Produccion → Approvals and checks). Sin servidor de desarrollo: la usuaria
#   eligió quedarse solo con producción (19/11/2026).
# También se puede lanzar a mano: Azure DevOps → Pipelines → EurovipBack → Run pipeline.
#
# Requisitos en Azure DevOps (proyecto EurovipBack):
#   - Pool "Prod-Agents" (agente prod-agent-srvweb2, el de BackTiTan en PRODUCCIÓN) autorizado para EurovipBack
#   - Environment "Produccion" CON aprobación manual en el proyecto EurovipBack
#   - Variable secreta EurovipAppSettingsLocalProd (appsettings.Local.json de producción en base64; si no se
#     define, se usa EurovipAppSettingsLocal)
#
# Requisitos en el servidor: ver DeploymentScripts/README-DESPLIEGUE.md
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**.md'
      - Docs/**
      - Database/**

variables:
  buildConfiguration: 'Release'
  dotnetVersion:      '8.0.x'
  projectPath:        'EuroVip/EuroVip.csproj'
  projectName:        'eurovipBack'      # nombre del sitio IIS y de C:\inetpub\wwwroot\eurovipBack (Blue/Green)
  # Solo se usan si el sitio IIS no existe (primer deploy: Deploy.ps1 lo crea)
  eurovipPuerto:      '8090'
  eurovipHost:        ''
  # PRODUCCIÓN (bktitan.eurovip.com.do): mismo servidor y agente que BackTiTan en producción
  prodAgentPool:      'Prod-Agents'
  prodAgentName:      'prod-agent-srvweb2'
  prodProjectName:    'eurovipBack'      # sitio IIS con carpetas Blue/Green en C:\inetpub\wwwroot\eurovipBack
  prodPuerto:         '8090'
  prodHost:           ''                 # vacío en el primer deploy: el sitio nuevo no le quita el dominio al actual
  # Variable SECRETA que se define en el pipeline (NO en este archivo):
  #   EurovipAppSettingsLocal = appsettings.Local.json en base64 (cadena de conexión, WhatsApp…)

stages:

  # ============================================================
  # STAGE 1: BUILD
  # Genera el artifact una sola vez, en un agente de Microsoft
  # (no consume recursos del servidor).
  # ============================================================
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildJob
        displayName: 'Build & Publish'
        pool:
          vmImage: 'windows-latest'

        steps:
          - checkout: self
            displayName: 'Checkout'

          - task: UseDotNet@2
            displayName: 'Use .NET $(dotnetVersion)'
            inputs:
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(projectPath)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/app'
              zipAfterPublish: false
              modifyOutputPath: false

          # Los scripts de deploy van en el artifact para que el agente del servidor los ejecute sin acceso al repo.
          - task: CopyFiles@2
            displayName: 'Copy Deployment Scripts'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/DeploymentScripts'
              Contents: '*.ps1'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/scripts'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact: drop'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'

  # ============================================================
  # STAGE 2: DEPLOY A PRODUCCIÓN (bktitan.eurovip.com.do)
  # Solo desde main, después del Build. Espera la aprobación del Environment «Produccion».
  # El MISMO artifact del Build (no se recompila). Agente prod-agent-srvweb2, como BackTiTan.
  # ============================================================
  - stage: DeployProd
    displayName: 'Deploy → PRODUCCIÓN'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - deployment: DeployProdJob
        displayName: 'Deploy Eurovip a producción'
        environment: 'Produccion'
        pool:
          name: ${{ variables.prodAgentPool }}
          demands:
            - Agent.Name -equals ${{ variables.prodAgentName }}

        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: PowerShell@2
                  displayName: 'Blue-Green Deploy'
                  inputs:
                    filePath: '$(Pipeline.Workspace)/drop/scripts/Deploy.ps1'
                    arguments: >-
                      -ProjectName "$(prodProjectName)"
                      -ArtifactsPath "$(Pipeline.Workspace)/drop/app"
                      -HealthCheckPath "/health"
                      -Puerto $(prodPuerto)
                      -NombreHost "$(prodHost)"
                    errorActionPreference: 'stop'
                  env:
                    EUROVIP_APPSETTINGS_LOCAL: $(EurovipAppSettingsLocal)
                    EUROVIP_APPSETTINGS_LOCAL_PROD: $(EurovipAppSettingsLocalProd)   # si existe, Deploy.ps1 la prefiere
